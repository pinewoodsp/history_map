<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동작구 역사 탐방 - 3단 리플렛</title>
    <style>
        :root {
            --bg: #d6cfc4;
            
            /* 
               💎 [초고해상도 뼈대 설정] 
               가운데 패널 너비(660px) * 3 = 전체 너비 1980px, height 1400px의 초고화질 도화지 생성
            */
            --panel-w: 660px;
            --panel-h: 1400px;
            
            --ctrl-bg: #2b2118;
            --btn-border: #b89060;
            --btn-text: #e8d5b0;
            --btn-active-bg: #7a5230;
            --fold-line: rgba(0,0,0,0.18);
            
            /* 📱 모니터 크기에 맞춰 화면에 알맞게 줄여서(Scale-Down) 보여주기 위한 기본 배율 */
            --scene-scale: 0.45; 

            /* 
               [깃허브 이미지 및 음악 연결 설정]
               - front.png : 등산객 표지, 코스안내, 용양봉저정 지도가 그려진 겉면 이미지
               - back.png  : 01, 02, 03 숫자가 그려진 안쪽면 상세 이미지
               - music.mp3 : 깃허브에 음악 파일을 업로드할 때 파일명을 music.mp3로 올리면 자동 연동됩니다.
            */
            --img-front: url('./front.png');
            --img-back: url('./back.png');
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Noto Serif KR', 'Malgun Gothic', Georgia, serif;
            background: var(--bg);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── 컨트롤 영역 ── */
        .controls {
            text-align: center;
            padding: 28px 20px 14px;
            background: var(--ctrl-bg);
            color: #e8d5b0;
            position: relative;
            z-index: 10;
        }

        .controls h2 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
            color: #f0e0c0;
        }

        .controls p {
            color: #998870;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .size-info {
            color: #665544;
            font-size: 11px;
            margin-bottom: 16px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .button-group button {
            padding: 8px 22px;
            border: 1.5px solid var(--btn-border);
            background: transparent;
            color: var(--btn-text);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .button-group button:hover,
        .button-group button.active {
            background: var(--btn-active-bg);
            border-color: #c8a070;
            color: #fff8ec;
        }

        /* 💾 초록색 다운로드 버튼 전용 스타일 */
        .button-group a.btn-download {
            display: inline-block;
            padding: 8px 22px;
            border: 1.5px solid #5a7a3a;
            background: transparent;
            color: #c8e0c0;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .button-group a.btn-download:hover {
            background: #4a6630;
            border-color: #7ab050;
            color: #fff;
        }

        /* 🔍 확대/축소 컨트롤러 */
        .zoom-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: #e8d5b0;
            font-size: 13px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .zoom-control input[type="range"] {
            width: 160px;
            cursor: pointer;
            accent-color: var(--btn-border);
        }

        .drag-hint {
            margin-top: 10px;
            color: #665544;
            font-size: 12px;
            padding-bottom: 16px;
        }

        /* ── 씬(3D 공간) ── */
        .scene-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            min-height: 720px;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.18) 0%, transparent 70%);
        }

        .scene {
            width: 1000px;
            height: 720px;
            perspective: 2500px;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .scene:active { cursor: grabbing; }

        .leaflet {
            width: 1980px; /* 초고화질 패널 3개 너비 합 (660px * 3) */
            height: var(--panel-h);
            
            /* 🎯 [정중앙 절대 고정] */
            position: absolute;
            left: 50%;
            top: 50%;
            margin-left: -990px;
            margin-top: -700px;
            transform-origin: center center;
            transform-style: preserve-3d;
            
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ── 패널 기본 ── */
        .panel {
            position: absolute;
            width: var(--panel-w);
            height: var(--panel-h);
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .panel-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background-size: 300% 100%;
            background-repeat: no-repeat;
            overflow: hidden;

            /* ✨ 하드웨어 GPU 가속 유도로 흐려짐 방지 */
            transform: translateZ(0.1px); 
            will-change: transform;
            image-rendering: auto;
        }

        /* ── 📰 안쪽 상세면 매핑 ── */
        .panel-left > .panel-front {
            background-image: var(--img-back);
            background-position: 0% center;
        }
        .panel-center > .panel-front {
            background-image: var(--img-back);
            background-position: 50% center;
        }
        .panel-right > .panel-front {
            background-image: var(--img-back);
            background-position: 100% center;
        }

        /* ── 🗺️ 겉면 매핑 ── */
        .panel-left > .panel-back {
            background-image: var(--img-front);
            background-position: 100% center;
        }
        .panel-center > .panel-back {
            background-image: var(--img-front);
            background-position: 50% center;
        }
        .panel-right > .panel-back {
            background-image: var(--img-front);
            background-position: 0% center;
        }

        /* ── 그림자 & 테두리 ── */
        .panel-face {
            border: 1px solid rgba(0,0,0,0.15);
            box-shadow: 5px 5px 30px rgba(0,0,0,0.25);
        }

        .panel-back {
            transform: rotateY(180deg) translateZ(0.1px);
        }

        /* ── 접선 (점선) ── */
        .panel-left > .panel-front::after,
        .panel-left > .panel-back::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0; right: 0;
            width: 0;
            border-right: 2px dashed rgba(255,255,255,0.3);
            pointer-events: none;
        }

        .panel-center > .panel-front::after,
        .panel-center > .panel-back::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0; right: 0;
            width: 0;
            border-right: 2px dashed rgba(255,255,255,0.3);
            pointer-events: none;
        }

        /* ── 패널 위치 ── */
        .panel-left {
            left: 0px;
            top: 0;
            transform-origin: right center;
        }

        .panel-center {
            left: 660px;
            top: 0;
            transform-style: preserve-3d;
        }

        .panel-right {
            left: 660px;
            top: 0;
            transform-origin: left center;
        }

        /* ── 접기 애니메이션 ── */
        .leaflet.folded .panel-left  { transform: rotateY(180deg) translateZ(-1px); }
        .leaflet.folded .panel-right { transform: rotateY(-180deg) translateZ(-3px); }
        
        .leaflet.half   .panel-left  { transform: rotateY(90deg) translateZ(0px); }
        .leaflet.half   .panel-right { transform: rotateY(-90deg) translateZ(0px); }
        
        .leaflet.open   .panel-left  { transform: rotateY(0deg) translateZ(0px); }
        .leaflet.open   .panel-right { transform: rotateY(0deg) translateZ(0px); }

        /* ── 🗺️ 실제 지도 찾기 보드 스타일 (리플렛 텍스트를 절대 가리지 않는 구조) ── */
        .map-board {
            max-width: 700px;
            margin: 0 auto 50px;
            padding: 20px;
            background: #fdf5ea;
            border-radius: 12px;
            border: 1px solid #d4bc9a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            text-align: center;
        }

        .map-board h3 {
            font-size: 15px;
            color: #4a3320;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .map-links-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .map-card-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 10px;
            background: #fff8f0;
            border: 1.5px solid #e8d5b4;
            border-radius: 8px;
            text-decoration: none;
            color: #4a3320;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.25s ease;
        }

        .map-card-link:hover {
            background: var(--btn-active-bg);
            border-color: #c8a070;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .map-card-link span {
            font-size: 16px;
        }

        /* ── 📱 반응형 화면 맞춤 스케일 제어 ── */
        @media (max-width: 1200px) {
            :root { --scene-scale: 0.36; }
            .scene { width: 800px; height: 560px; }
            .map-links-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 900px) {
            :root { --scene-scale: 0.25; }
            .scene { width: 560px; height: 420px; }
        }
        @media (max-width: 600px) {
            :root { --scene-scale: 0.17; }
            .scene { width: 380px; height: 300px; }
        }
        @media (max-width: 400px) {
            :root { --scene-scale: 0.13; }
            .scene { width: 300px; height: 240px; }
        }
    </style>
</head>
<body>

<!-- 🎵 배경음악 재생 태그 (내 깃허브에 music.mp3라는 파일명으로 올린 경우 연동됨) -->
<audio id="bgm" loop>
    <source src="./music.mp3" type="audio/mpeg">
</audio>

<div class="controls">
    <h2>동작구 역사 탐방 · 리플렛 미리보기</h2>
    <p>3D 3단 리플렛 · 마우스로 돌려보세요</p>
    <div class="size-info">A4 용지 (297mm × 210mm) 기준 · 각 면 99mm × 210mm</div>
    
    <!-- 첫 번째 버튼 그룹: 3D 컨트롤러 및 음악 -->
    <div class="button-group">
        <button id="btn-folded" class="active">📕 접힌 상태</button>
        <button id="btn-half">📖 반쯤 펼침</button>
        <button id="btn-open">📰 완전히 펼침</button>
        <button id="btn-flip">🔄 뒤집기</button>
        <button id="btn-music" aria-label="배경 음악 켜고 끄기">🎵 배경 음악 재생 (단축키 M)</button>
    </div>

    <!-- 💾 두 번째 버튼 그룹: 깃허브 원본 고화질 이미지 다운로드 링크 -->
    <div class="button-group" style="margin-top: 8px;">
        <a href="./front.png" download="동작구_역사_탐방_겉면.png" class="btn-download" title="앞면/표지/지도가 있는 이미지 다운로드">💾 겉면(앞면) 이미지 다운로드</a>
        <a href="./back.png" download="동작구_역사_탐방_내지.png" class="btn-download" title="01, 02, 03 안쪽 설명이 있는 이미지 다운로드">💾 내지(뒷면) 이미지 다운로드</a>
    </div>
    
    <!-- 🔍 확대/축소 슬라이더 -->
    <div class="zoom-control">
        <span>🔍 확대/축소 :</span>
        <input type="range" id="zoom-range" min="0.5" max="2.5" step="0.05" value="1" aria-label="리플렛 크기 조절 슬라이더">
        <span id="zoom-value">100%</span>
    </div>

    <div class="drag-hint">⌨️ 키보드 자판의 [ M ] 을 누르면 업로드한 음악을 편하게 켜고 끌 수 있습니다.</div>
</div>

<div class="scene-container">
    <div class="scene" id="scene">
        <div class="leaflet folded" id="leaflet" tabindex="0">

            <!-- 왼쪽 패널 (01 용양봉저정 / 공원 지도) -->
            <div class="panel panel-left">
                <div class="panel-face panel-front"></div>
                <div class="panel-face panel-back"></div>
            </div>

            <!-- 가운데 패널 (02 사육신 / 추천코스 안내) -->
            <div class="panel panel-center">
                <div class="panel-face panel-front"></div>
                <div class="panel-face panel-back"></div>

                <!-- 오른쪽 패널 (03 국립서울 현충원 / 등산객 표지) -->
                <div class="panel panel-right">
                    <div class="panel-face panel-front"></div>
                    <div class="panel-face panel-back"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- 🗺️ 역사지 길찾기 바로가기 보드 (리플렛 텍스트 가림 방지) -->
<div class="map-board">
    <h3>📍 동작구 역사지 실제 위치 길찾기 (카카오맵 연동)</h3>
    <div class="map-links-grid">
        <a href="https://map.kakao.com/?q=%EC%9A%A9%EC%96%91%EB%B4%89%EC%A0%80%EC%A0%95" target="_blank" class="map-card-link">
            <span>🗺️</span> 01 용양봉저정 길찾기
        </a>
        <a href="https://map.kakao.com/?q=%EC%82%AC%EC%9C%A1%EC%8B%A0%EC%97%AD%EC%82%AC%EA%B3%B5%EC%9B%90" target="_blank" class="map-card-link">
            <span>🗺️</span> 02 사육신 역사공원 길찾기
        </a>
        <a href="https://map.kakao.com/?q=%EA%B5%AD%EB%A6%BD%EC%84%9C%EC%9A%B8%ED%98%84%EC%B6%A9%EC%9B%90" target="_blank" class="map-card-link">
            <span>🗺️</span> 03 국립서울 현충원 길찾기
        </a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var leaflet = document.getElementById('leaflet');
    var scene   = document.getElementById('scene');
    var btnFolded = document.getElementById('btn-folded');
    var btnHalf   = document.getElementById('btn-half');
    var btnOpen   = document.getElementById('btn-open');
    var btnFlip   = document.getElementById('btn-flip');

    // BGM 연동 변수
    var bgm = document.getElementById('bgm');
    var btnMusic = document.getElementById('btn-music');
    var isPlayingMusic = false;

    // 🔊 [요청사항 반영] 배경음악 기본 볼륨을 귀에 부담이 없는 50%로 고정 설정
    bgm.volume = 0.5;

    // 확대/축소 변수
    var zoomRange = document.getElementById('zoom-range');
    var zoomValue = document.getElementById('zoom-value');

    var isFlipped = false;
    var isDragging = false;
    var startX, startY;
    var rotX = -8, rotY = -15;
    var curRotX = rotX, curRotY = rotY;
    var zoomLevel = 1; // 기본 100%

    function setActive(btn) {
        [btnFolded, btnHalf, btnOpen, btnFlip].forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
    }

    function setState(state) {
        leaflet.classList.remove('folded','half','open');
        leaflet.classList.add(state);
    }

    // JS 기반 3D Transform 문자열 연산
    function updateTransform() {
        leaflet.style.transform = 'scale(calc(var(--scene-scale) * ' + zoomLevel + ')) rotateY(' + curRotY + 'deg) rotateX(' + curRotX + 'deg)';
    }

    updateTransform();

    btnFolded.addEventListener('click', function() { setState('folded'); setActive(btnFolded); });
    btnHalf.addEventListener('click',   function() { setState('half');   setActive(btnHalf);   });
    btnOpen.addEventListener('click',   function() { setState('open');   setActive(btnOpen);   });

    btnFlip.addEventListener('click', function() {
        isFlipped = !isFlipped;
        rotY = isFlipped ? 165 : -15;
        rotX = -8;
        curRotX = rotX; curRotY = rotY;
        updateTransform();
        btnFlip.classList.toggle('active', isFlipped);
    });

    // 🔍 슬라이더 이벤트
    zoomRange.addEventListener('input', function(e) {
        zoomLevel = parseFloat(e.target.value);
        zoomValue.textContent = Math.round(zoomLevel * 100) + '%';
        updateTransform();
    });

    // 🖱 마우스 휠 이벤트
    scene.addEventListener('wheel', function(e) {
        e.preventDefault();
        if (e.deltaY < 0) {
            zoomLevel = Math.min(2.5, zoomLevel + 0.05);
        } else {
            zoomLevel = Math.max(0.5, zoomLevel - 0.05);
        }
        zoomRange.value = zoomLevel;
        zoomValue.textContent = Math.round(zoomLevel * 100) + '%';
        updateTransform();
    }, { passive: false });

    // 🎵 [배경음악 켜기/끄기 로직]
    function toggleMusic() {
        if (isPlayingMusic) {
            bgm.pause();
            isPlayingMusic = false;
            btnMusic.classList.remove('active');
            btnMusic.textContent = "🎵 배경 음악 재생 (단축키 M)";
        } else {
            bgm.play().then(function() {
                isPlayingMusic = true;
                btnMusic.classList.add('active');
                btnMusic.textContent = "⏸ 배경 음악 일시정지 (단축키 M)";
            }).catch(function(err) {
                alert("음악 파일(music.mp3)이 아직 깃허브에 업로드되지 않았거나, 브라우저 정책으로 재생이 차단되었습니다. 화면 빈 곳을 한 번 클릭한 후 다시 재생해 주세요!");
            });
        }
    }

    btnMusic.addEventListener('click', toggleMusic);

    // 자판 핫키(단축키 M) 감지 시스템
    document.addEventListener('keydown', function(e) {
        var key = e.key.toLowerCase();
        if (key === 'm') {
            e.preventDefault();
            toggleMusic();
        }
    });

    // 3D 회전 마우스 드래그 이벤트
    scene.addEventListener('mousedown', function(e) {
        isDragging = true;
        startX = e.clientX; startY = e.clientY;
        leaflet.style.transition = 'none';
    });

    document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        curRotY = rotY + (e.clientX - startX) * 0.4;
        curRotX = Math.max(-65, Math.min(65, rotX - (e.clientY - startY) * 0.4));
        updateTransform();
    });

    document.addEventListener('mouseup', function() {
        if (!isDragging) return;
        isDragging = false;
        rotX = curRotX; rotY = curRotY;
        leaflet.style.transition = 'transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    });

    // 모바일 터치 이벤트
    scene.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            leaflet.style.transition = 'none';
        }
    });

    document.addEventListener('touchmove', function(e) {
        if (!isDragging || e.touches.length !== 1) return;
        curRotY = rotY + (e.touches[0].clientX - startX) * 0.4;
        curRotX = Math.max(-65, Math.min(65, rotX - (e.touches[0].clientY - startY) * 0.4));
        updateTransform();
    });

    document.addEventListener('touchend', function() {
        if (!isDragging) return;
        isDragging = false;
        rotX = curRotX; rotY = curRotY;
        leaflet.style.transition = 'transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    });
});
</script>
